<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocIntel · Document Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
:root{--bg:#050b1f;--panel:#0c1530;--panel2:#111d3f;--line:#1e2c57;--tx:#e8ecf8;--mut:#8d9ac2;--acc:#ff4c14;--ok:#2fd18b;--warn:#ffb020;--err:#ff5470;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f4f6fc;--panel:#fff;--panel2:#eef1fa;--line:#d7ddf0;--tx:#0b1230;--mut:#5b6893;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Inter",system-ui,Segoe UI,sans-serif}
.app{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:100vh}
header{display:flex;flex-direction:column;align-items:center;gap:28px;padding:20px 10px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:22px;line-height:1}.logo span{color:var(--acc)}nav{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
nav button{display:flex;align-items:center;justify-content:center;width:50px;height:50px;background:none;border:0;color:var(--mut);border-radius:12px;cursor:pointer;font:inherit;font-weight:600;position:relative}nav button.on{color:var(--tx);background:var(--panel2)}nav button:hover{color:var(--tx);background:var(--panel2)}.nav-icon{font-size:22px;line-height:1}.nav-label{position:absolute;left:60px;top:50%;transform:translateY(-50%);padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}nav button:hover .nav-label,nav button:focus-visible .nav-label{opacity:1}
main{width:min(1280px,100%);margin:0 auto;padding:24px 28px}h2{margin:0 0 14px;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.card .n{font-size:28px;font-weight:800}.card .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.drop{border:2px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--mut);cursor:pointer;margin-bottom:20px;background:var(--panel)}.drop.over{border-color:var(--acc);color:var(--tx)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}.btn.ghost{background:var(--panel2);color:var(--tx)}.btn.sm{padding:5px 12px;font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:var(--panel2)}tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.scroll{overflow-x:auto}.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.completed,.ok,.corrected{background:#2fd18b22;color:var(--ok)}.needs_review,.warning{background:#ffb02022;color:var(--warn)}.failed,.error{background:#ff547022;color:var(--err)}.queued,.processing,.duplicate{background:#6d8bff22;color:#8fa6ff}
.bar{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;min-width:110px}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}input,select{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:8px 10px;font:inherit}
.drawer{position:fixed;inset:0 0 0 auto;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:20;overflow:auto;padding:24px;box-shadow:-20px 0 60px #0008}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:4px}.field input{width:100%}
.conf{font-weight:700}.issue{padding:10px 12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line);background:var(--panel)}
pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:280px;overflow:auto;font-size:12px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;z-index:50}.mut{color:var(--mut)}
@media(max-width:640px){.app{grid-template-columns:60px minmax(0,1fr)}header{padding:16px 5px}nav button{width:46px;height:46px}main{padding:18px 12px}.cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}}
.landing-page{min-height:100vh;overflow:hidden;background:linear-gradient(112deg,#eef2f5 0%,#f6f5f5 54%,#fbf1ed 100%);color:#10182f;position:relative}
.landing-topbar{position:relative;top:auto;z-index:2;height:auto;min-height:66px;width:auto;flex-direction:row;gap:28px;background:#fff;border-right:0;border-bottom:1px solid #e8eaf0;padding:10px max(24px,calc((100vw - 1215px)/2));display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand-lockup{display:flex;align-items:center;gap:12px;color:#10182f;text-decoration:none;justify-self:start}
.brand-mark{width:40px;height:40px;border-radius:12px;background:#ff6338;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;box-shadow:0 5px 12px #ff633833}
.brand-copy{display:grid;line-height:1.15;gap:3px}.brand-copy strong{font-size:18px;letter-spacing:-.04em}.brand-copy span{font-size:9px;color:#68758e;letter-spacing:.09em;font-weight:700}.brand-copy small{display:none}
.landing-links{display:flex;flex-direction:row;align-items:center;justify-content:center;width:auto;flex:initial;gap:30px;white-space:nowrap}.landing-links a{color:#46516a;text-decoration:none;font-size:13px;font-weight:600}.landing-links a:hover{color:#ff6338}.landing-top-cta{justify-self:end}
.landing-page .btn{background:#ff6338;color:#fff;border:0;border-radius:12px;padding:12px 18px;box-shadow:0 5px 12px #ff633833}
.landing-page .btn:hover{background:#f4512c}.landing-page .btn.ghost{background:#fff;color:#1a2440;border:1px solid #d9deea;box-shadow:0 2px 4px #1118270a}
.landing-hero{position:relative;z-index:1;max-width:1160px;margin:auto;padding:78px 24px 220px;text-align:center}
.hero-copy{max-width:100%;margin:0 auto}.eyebrow{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ff63382a;background:#ff63380b;color:#f07859;font-size:14px;font-weight:650;padding:8px 20px;border-radius:999px;margin:0 0 20px}
.eyebrow:before{content:none}.hero-copy h1{font-size:clamp(44px,6.1vw,66px);letter-spacing:-.055em;line-height:1.08;margin:0 0 18px;color:#10182f}.hero-copy h1 span{background:linear-gradient(90deg,#ff6338,#ff9d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{font-size:20px;line-height:1.45;color:#52617d;max-width:720px;margin:0 auto 30px}
.hero-actions{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.hero-actions .btn{padding:16px 28px;border-radius:12px;font-size:15px}.hero-actions .btn.ghost{border:1px solid #d5d9e3;background:#fff}
.hero-proof,.proof-dot{display:none}
.hero-art{max-width:1160px;margin:0 auto;min-height:0;padding:0 24px 45px;position:relative;display:grid;place-items:center;scroll-margin-top:25px}
.art-glow{display:none}
.preview-window{position:relative;width:min(100%,1040px);padding:20px;border:1px solid #293658;border-radius:20px;background:linear-gradient(145deg,#111c3a,#0b1229);box-shadow:0 24px 60px #25335225;transform:none}
.preview-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid #ffffff1c;color:#f5f7ff}.preview-title{display:flex;align-items:center;gap:10px;font-weight:700}.preview-icon{width:34px;height:38px;border-radius:8px;background:#ff4c1422;color:#ff7955;display:grid;place-items:center;font-size:18px}.preview-pill{font-size:10px;padding:5px 9px;border-radius:20px;color:#59dfa4;background:#2fd18b18}
.preview-label{font-size:10px;color:#a5b0c9;text-transform:uppercase;letter-spacing:.11em;margin:19px 0 10px}.invoice-sheet{max-width:620px;margin:0 auto 14px;background:#f6f7fb;color:#15203a;border-radius:12px;padding:18px}
.sheet-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #dfe3ed;padding-bottom:13px}.sheet-brand{font-size:11px;font-weight:800}.sheet-number{font-size:9px;color:#75809a}.sheet-lines{display:grid;gap:9px;padding-top:13px}.sheet-line{display:grid;grid-template-columns:1fr 90px;gap:10px;font-size:9px;color:#717d98}.sheet-line b{color:#222e49;text-align:right}.sheet-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:2px;border-top:1px solid #dfe3ed;font-size:10px;font-weight:800;color:#19243e}
.preview-result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.result-chip{padding:10px;border-radius:10px;background:#ffffff0b;border:1px solid #ffffff16}.result-chip span{display:block;color:#a5b0c9;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.result-chip b{display:block;margin-top:5px;font-size:12px;color:#e8ecf8}
.float-card{display:none}
.landing-features{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:8px 24px 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;scroll-margin-top:25px}
.landing-feature{padding:18px 20px;border:1px solid #e0e4eb;border-radius:15px;background:#ffffffa8}.landing-feature b{display:block;font-size:13px;margin:0 0 5px;color:#18213a}.landing-feature span{font-size:12px;line-height:1.6;color:#66738d}
.landing-footer{position:relative;z-index:1;padding:18px 30px;border-top:1px solid #e3e5e9;text-align:center;color:#74809a;font-size:11px}
@media(max-width:1100px){.landing-topbar{grid-template-columns:1fr auto;padding:10px 20px}.landing-links{grid-column:1/-1;grid-row:2;gap:22px;padding:2px 0 8px}.landing-top-cta{grid-column:2;grid-row:1}.landing-hero{padding-top:62px}.hero-art{padding-left:20px;padding-right:20px}}
@media(max-width:640px){.landing-topbar{gap:10px;padding:10px 14px}.brand-mark{width:36px;height:36px}.brand-copy strong{font-size:16px}.landing-links{justify-content:space-between;gap:10px}.landing-links a{font-size:11px}.landing-top-cta .btn{padding:10px 12px;font-size:12px}.landing-hero{padding:54px 18px 70px}.hero-copy h1{font-size:clamp(39px,10.5vw,54px)}.hero-copy p{font-size:16px}.hero-actions{gap:10px}.hero-actions .btn{padding:13px 17px;font-size:13px}.hero-art{padding:0 14px 32px}.preview-window{padding:14px}.landing-features{grid-template-columns:1fr;padding:8px 18px 30px}.preview-result{grid-template-columns:1fr 1fr}.landing-pricing{padding-left:18px;padding-right:18px}}
</style></head><body><div id="root"></div>
<script>
const {useState,useEffect,useRef,useCallback}=React;const html=htm.bind(React.createElement);
const API=(path,opts={})=>{const k=localStorage.getItem("apiKey");return fetch("/api"+path,{...opts,headers:{...(opts.headers||{}),...(k?{"X-API-Key":k}:{})}}).then(async r=>{
  if(r.status===401){const v=prompt("API key required");if(v){localStorage.setItem("apiKey",v);return API(path,opts)}}
  if(!r.ok){let m=r.statusText;try{const j=await r.json();m=typeof j.detail==="string"?j.detail:JSON.stringify(j.detail)}catch(e){}throw new Error(m)}return r.json()})};
const money=v=>v==null?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:2});
const Badge=({s})=>html`<span class=${"badge "+s}>${s.replace("_"," ")}</span>`;
const Toast=({msg})=>msg?html`<div class="toast">${msg}</div>`:null;

function usePoll(fn,ms,deps){const [d,setD]=useState(null);useEffect(()=>{let on=true,t;const run=async()=>{try{const r=await fn();if(on)setD(r)}catch(e){}if(on)t=setTimeout(run,ms)};run();return()=>{on=false;clearTimeout(t)}},deps);return d}

function Landing({openWorkspace}){
  return html`<div class="landing-page">
    <header class="landing-topbar">
      <a class="brand-lockup" href="#" onClick=${e=>e.preventDefault()} aria-label="DocIntel home">
        <span class="brand-mark">D</span><span class="brand-copy"><strong>DocIntel</strong><span>DOCUMENT INTELLIGENCE</span></span>
      </a>
      <nav class="landing-links" aria-label="Main navigation">
        <a href="#features">Features</a><a href="#capabilities">Capabilities</a><a href="#demo">Interactive Demo</a><a href="#pricing">Pricing</a>
      </nav>
      <button class="btn landing-top-cta" onClick=${openWorkspace}>Open Workspace <span aria-hidden="true">→</span></button>
    </header>
    <section class="landing-hero">
      <div class="hero-copy">
        <div class="eyebrow">Next-Gen Document Intelligence Platform</div>
        <h1>Turn documents into <span>decisions.</span></h1>
        <p>Extract actionable insights, automate workflows, and analyze business documents in seconds with document intelligence.</p>
        <div class="hero-actions"><button class="btn" onClick=${openWorkspace}>Open Workspace <span aria-hidden="true">→</span></button><a class="btn ghost" href="#demo"><span aria-hidden="true">⊙</span> Watch Demo</a></div>
      </div>
    </section>
    <section class="hero-art" id="demo" aria-label="Illustration of an invoice being processed into structured data">
        <div class="preview-window">
          <div class="preview-top"><div class="preview-title"><span class="preview-icon">▤</span> Example invoice</div><span class="preview-pill">Sample preview</span></div>
          <div class="preview-label">Illustrative extracted data</div>
          <div class="invoice-sheet">
            <div class="sheet-head"><div class="sheet-brand">NORTHSTAR<br/>SUPPLIES</div><div class="sheet-number">INVOICE&nbsp; #INV-2048</div></div>
            <div class="sheet-lines"><div class="sheet-line"><span>Office supplies</span><b>$240.00</b></div><div class="sheet-line"><span>Shipping</span><b>$18.00</b></div><div class="sheet-line"><span>Tax</span><b>$20.64</b></div><div class="sheet-total"><span>Total</span><span>$278.64</span></div></div>
          </div>
          <div class="preview-result"><div class="result-chip"><span>Supplier</span><b>Northstar</b></div><div class="result-chip"><span>Invoice</span><b>INV-2048</b></div><div class="result-chip"><span>Review</span><b>Sample</b></div></div>
        </div>
        <div class="float-card"><strong><span class="float-check">✓</span>Review workflow</strong>Validation checks flag items to inspect</div>
    </section>
    <section class="landing-features" id="features" aria-label="Features and capabilities">
      <div class="landing-feature" id="capabilities"><b>Read documents</b><span>Extract text from PDFs, scans, images, spreadsheets, and Word files.</span></div>
      <div class="landing-feature"><b>Check the details</b><span>Validate invoice fields and totals, and flag items that need a human review.</span></div>
      <div class="landing-feature"><b>Find information</b><span>Search processed records and inspect the source text behind each result.</span></div>
    </section>
    <footer class="landing-footer">DocIntel · Document Intelligence for business documents</footer>
  </div>`
}

function Dashboard({open,toast}){
  const [over,setOver]=useState(false),input=useRef();
  const stats=usePoll(()=>API("/stats"),2500,[]),docs=usePoll(()=>API("/documents?limit=100"),1200,[]);
  const upload=async files=>{if(!files.length)return;const fd=new FormData();[...files].forEach(f=>fd.append("files",f));
    try{const r=await API("/documents",{method:"POST",body:fd});toast(`${r.documents.length} queued`+(r.rejected.length?` · ${r.rejected.length} rejected: ${r.rejected.map(x=>x.filename+" ("+x.error+")").join(", ")}`:""))}catch(e){toast("Upload failed: "+e.message)}};
  const reprocess=async(id,e)=>{e.stopPropagation();try{await API(`/documents/${id}/reprocess?force=true`,{method:"POST"});toast("Re-queued #"+id)}catch(x){toast(x.message)}};
  const remove=async(id,e)=>{e.stopPropagation();if(!confirm(`Delete document #${id} and its uploaded file?`))return;try{await API(`/documents/${id}`,{method:"DELETE"});toast("Deleted document #"+id)}catch(x){toast("Delete failed: "+x.message)}};
  const S=stats||{documents:{}};
  return html`<div>
    <div class="cards">${[["Documents",S.total_documents],["Records",S.records],["Needs review",S.records_needing_review],["Success rate",S.success_rate!=null?(S.success_rate*100).toFixed(1)+"%":"—"],["Avg time",S.avg_processing_ms?S.avg_processing_ms+" ms":"—"],["Pages",S.pages_processed]].map(([l,n])=>html`<div class="card" key=${l}><div class="n">${n??0}</div><div class="l">${l}</div></div>`)}</div>
    <div class=${"drop"+(over?" over":"")} onClick=${()=>input.current.click()} onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)} onDrop=${e=>{e.preventDefault();setOver(false);upload(e.dataTransfer.files)}}>
      <div style=${{fontSize:18,fontWeight:700,color:"var(--tx)"}}>Drop invoices here or click to browse</div><div>PDF · JPG · PNG · TIFF · XLSX · XLS · CSV · DOCX · DOC — multiple files, up to 200 MB each</div>
      <input ref=${input} type="file" multiple hidden accept=".pdf,.jpg,.jpeg,.png,.tif,.tiff,.xlsx,.xls,.csv,.docx,.doc" onChange=${e=>{upload(e.target.files);e.target.value=""}}/></div>
    <h2>Processing queue</h2><div class="scroll"><table><thead><tr><th>#</th><th>File</th><th>Type</th><th>Status</th><th>Progress</th><th>Pages</th><th>Time</th><th></th></tr></thead><tbody>
    ${(docs?.items||[]).map(d=>html`<tr class="click" key=${d.id} onClick=${()=>open({doc:d.id})}><td>${d.id}</td><td>${d.filename}${d.error?html`<div class="mut" style=${{fontSize:12,color:"var(--err)"}}>${d.error}</div>`:""}</td><td>${d.kind||"—"}</td><td><${Badge} s=${d.status}/></td>
      <td><div class="bar"><i style=${{width:d.progress+"%"}}></i></div><span class="mut" style=${{fontSize:11}}>${d.stage}</span></td><td>${d.page_count||"—"}</td><td>${d.processing_ms!=null?(d.processing_ms/1000).toFixed(1)+"s":"—"}</td>
      <td>${["failed","needs_review","completed"].includes(d.status)?html`<button class="btn ghost sm" onClick=${e=>reprocess(d.id,e)}>Reprocess</button>`:""} ${d.status!=="processing"?html`<button class="btn ghost sm" onClick=${e=>remove(d.id,e)}>Delete</button>`:""}</td></tr>`)}
    </tbody></table></div></div>`}

function Records({open}){
  const [f,setF]=useState({q:"",supplier:"",status:"",min_total:"",max_total:"",date_from:"",date_to:""}),[data,setData]=useState({items:[],total:0});
  const load=useCallback(()=>{const p=new URLSearchParams();Object.entries(f).forEach(([k,v])=>v!==""&&p.set(k,v));API("/invoices?limit=200&"+p).then(setData).catch(()=>{})},[f]);
  useEffect(()=>{const t=setTimeout(load,250);return()=>clearTimeout(t)},[load]);
  const set=k=>e=>setF({...f,[k]:e.target.value});
  return html`<div><h2>Extracted records <span class="mut">(${data.total})</span></h2><div class="filters">
    <input placeholder="Keyword" value=${f.q} onInput=${set("q")}/><input placeholder="Supplier" value=${f.supplier} onInput=${set("supplier")}/>
    <select value=${f.status} onChange=${set("status")}><option value="">Any status</option><option value="needs_review">Needs review</option><option value="ok">OK</option><option value="corrected">Corrected</option></select>
    <input type="number" placeholder="Min total" value=${f.min_total} onInput=${set("min_total")} style=${{width:110}}/><input type="number" placeholder="Max total" value=${f.max_total} onInput=${set("max_total")} style=${{width:110}}/>
    <input type="date" value=${f.date_from} onInput=${set("date_from")}/><input type="date" value=${f.date_to} onInput=${set("date_to")}/></div>
    <${RecTable} items=${data.items} open=${open}/></div>`}

const RecTable=({items,open,score})=>html`<div class="scroll"><table><thead><tr><th>Invoice #</th><th>Date</th><th>Supplier</th><th>Customer</th><th>Total</th><th>Cur</th><th>Status</th><th>Issues</th>${score?html`<th>Match</th>`:""}</tr></thead><tbody>
  ${items.map(r=>html`<tr class="click" key=${r.id} onClick=${()=>open({inv:r.id})}><td>${r.invoice_number||"—"}</td><td>${r.invoice_date||"—"}</td><td>${r.supplier||"—"}</td><td>${r.customer||"—"}</td><td>${money(r.total)}</td><td>${r.currency||"—"}</td><td><${Badge} s=${r.status}/></td><td>${r.issue_count||""}</td>${score?html`<td class="mut">${r.matched_by} · ${r.score}</td>`:""}</tr>`)}</tbody></table></div>`;

function Search({open}){
  const [q,setQ]=useState(""),[mode,setMode]=useState("hybrid"),[res,setRes]=useState(null);
  const go=async e=>{e&&e.preventDefault();if(q.trim())setRes((await API(`/search?q=${encodeURIComponent(q)}&mode=${mode}`)).results)};
  return html`<div><h2>Search processed documents</h2><form class="filters" onSubmit=${go}><input style=${{flex:1,minWidth:260}} placeholder="e.g. cloud hosting invoices from Acme, or INV-2025-0102" value=${q} onInput=${e=>setQ(e.target.value)}/>
    <select value=${mode} onChange=${e=>setMode(e.target.value)}><option value="hybrid">Hybrid</option><option value="keyword">Keyword</option><option value="semantic">Semantic</option></select><button class="btn">Search</button></form>
    ${res&&(res.length?html`<${RecTable} items=${res} open=${open} score=${true}/>`:html`<p class="mut">No matches.</p>`)}</div>`}

const FIELDS=[["invoice_number","Invoice number","text"],["invoice_date","Invoice date","date"],["supplier","Supplier","text"],["customer","Customer","text"],["subtotal","Subtotal","number"],["tax","Tax","number"],["total","Total","number"],["currency","Currency","text"]];
function Drawer({target,close,toast}){
  const [rec,setRec]=useState(null),[doc,setDoc]=useState(null),[form,setForm]=useState({}),[items,setItems]=useState([]),[tab,setTab]=useState("fields"),[page,setPage]=useState(null),[hist,setHist]=useState([]);
  const load=async()=>{if(target.inv){const r=await API("/invoices/"+target.inv);setRec(r);setForm(Object.fromEntries(FIELDS.map(([k])=>[k,r[k]??""])));setItems(r.line_items||[]);setDoc(await API("/documents/"+r.document_id))}else setDoc(await API("/documents/"+target.doc))};
  useEffect(()=>{load()},[target]);
  useEffect(()=>{if(doc)API(`/documents/${doc.id}/history`).then(setHist)},[doc?.id,rec?.status]);
  const save=async()=>{const body={};FIELDS.forEach(([k,,t])=>{const v=form[k];if(String(v)!==String(rec[k]??""))body[k]=v===""?null:(t==="number"?Number(v):v)});
    if(JSON.stringify(items)!==JSON.stringify(rec.line_items))body.line_items=items.map(i=>({description:i.description||"",quantity:i.quantity===""?null:i.quantity,unit_price:i.unit_price===""?null:i.unit_price,amount:i.amount===""?null:i.amount}));
    if(!Object.keys(body).length)return toast("No changes");try{const r=await API("/invoices/"+rec.id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});toast("Saved — status: "+r.status+(r.issues.length?" · "+r.issues.length+" issue(s) remain":""));load()}catch(e){toast("Error: "+e.message)}};
  const markReviewed=async()=>{try{const r=await API("/invoices/"+rec.id+"/review",{method:"POST"});setRec(r);setDoc(await API("/documents/"+r.document_id));toast("Marked as reviewed — status: "+r.status)}catch(e){toast("Review failed: "+e.message)}};
  const showPage=async n=>setPage(await API(`/documents/${doc.id}/pages/${n}`));
  const setItem=(i,k,v)=>setItems(items.map((x,n)=>n===i?{...x,[k]:v}:x));
  const cc=c=>c==null?"":html`<span class="conf" style=${{color:c>=.85?"var(--ok)":c>=.6?"var(--warn)":"var(--err)"}}>${Math.round(c*100)}%</span>`;
  return html`<div class="drawer"><div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><h2 style=${{margin:0}}>${rec?`Record #${rec.id} · ${rec.invoice_number||"no number"}`:doc?`Document #${doc.id}`:"Loading…"}</h2><button class="btn ghost sm" onClick=${close}>Close ✕</button></div>
   ${doc&&html`<p class="mut">${doc.filename} · ${doc.kind} · ${doc.page_count} page(s) · Document status: <${Badge} s=${doc.status}/> ${rec&&html`· Record status: <${Badge} s=${rec.status}/>`} ${doc.error?html`<span style=${{color:"var(--err)"}}>${doc.error}</span>`:""} · <a style=${{color:"var(--acc)"}} target="_blank" href=${"/api/documents/"+doc.id+"/file"+(localStorage.getItem("apiKey")?"?api_key="+localStorage.getItem("apiKey"):"")}>Original file</a></p>`}
   <div style=${{display:"flex",gap:6,marginBottom:14}}>${["fields","text","history"].map(t=>html`<button class=${"btn sm "+(tab===t?"":"ghost")} onClick=${()=>setTab(t)}>${t==="fields"?"Extracted data":t==="text"?"Source text":"History"}</button>`)}</div>
   ${tab==="fields"&&rec&&html`<div>
     ${rec.issues.length?html`<h3>Validation (${rec.issues.length})</h3>${rec.issues.map((i,n)=>html`<div class="issue" key=${n}><${Badge} s=${i.severity}/> <b>${i.field}</b> — ${i.message}</div>`)}`:html`<div class="issue"><${Badge} s="ok"/> All validation checks pass</div>`}
     ${rec.notes.length?html`<p class="mut">${rec.notes.join(" · ")}</p>`:""}
     ${rec.status==="needs_review"?html`<div style=${{margin:"12px 0"}}><button class="btn ghost sm" onClick=${markReviewed}>Confirm review → set record to OK</button><span class="mut" style=${{marginLeft:8,fontSize:12}}>Keeps the extracted values and validation findings; only the record status changes.</span></div>`:""}
     <h3>Fields <span class="mut" style=${{fontSize:12}}>method: ${rec.method}${rec.corrected?" · manually corrected":""}</span></h3><div class="grid2">${FIELDS.map(([k,l,t])=>html`<div class="field" key=${k}><label><span>${l}</span>${cc(rec.confidence[k])}</label><input type=${t==="number"?"number":t==="date"?"date":"text"} step="0.01" value=${form[k]??""} onInput=${e=>setForm({...form,[k]:e.target.value})}/></div>`)}</div>
     <h3>Line items</h3><div class="scroll"><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th><th></th></tr></thead><tbody>${items.map((it,i)=>html`<tr key=${i}><td><input value=${it.description??""} onInput=${e=>setItem(i,"description",e.target.value)}/></td>${["quantity","unit_price","amount"].map(k=>html`<td><input type="number" step="0.01" style=${{width:100}} value=${it[k]??""} onInput=${e=>setItem(i,k,e.target.value===""?"":Number(e.target.value))}/></td>`)}<td><button class="btn ghost sm" onClick=${()=>setItems(items.filter((_,n)=>n!==i))}>✕</button></td></tr>`)}</tbody></table></div>
     <div style=${{marginTop:12,display:"flex",gap:8}}><button class="btn ghost sm" onClick=${()=>setItems([...items,{description:"",quantity:null,unit_price:null,amount:null}])}>+ Add line</button><button class="btn" onClick=${save}>Save corrections & re-validate</button></div></div>`}
   ${tab==="fields"&&!rec&&doc&&html`<h3>Records in this document</h3>${doc.records.length?doc.records.map(r=>html`<div class="issue">#${r.id} ${r.invoice_number||"—"} · ${money(r.total)} <${Badge} s=${r.status}/></div>`):html`<p class="mut">No records extracted.</p>`}`}
   ${tab==="text"&&doc&&html`<div style=${{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>${doc.pages.slice(0,60).map(p=>html`<button class="btn ghost sm" onClick=${()=>showPage(p.page_no)}>p${p.page_no} · ${p.source}${p.ocr_confidence?" "+Math.round(p.ocr_confidence)+"%":""}</button>`)}</div>${page?html`<pre>${page.text||"(no text)"}</pre>`:html`<p class="mut">Pick a page to inspect the text the system actually read.</p>`}`}
   ${tab==="history"&&html`<div>${hist.map((h,i)=>html`<div class="issue" key=${i}><b>${h.event}</b> <span class="mut">${new Date(h.ts+"Z").toLocaleString()}</span><div class="mut" style=${{fontSize:12}}>${JSON.stringify(h.detail)}</div></div>`)}</div>`}</div>`}

function App(){
  const [view,setView]=useState("home"),[target,setTarget]=useState(null),[msg,setMsg]=useState("");
  const toast=m=>{setMsg(m);setTimeout(()=>setMsg(""),4500)};
  if(view==="home")return html`<${Landing} openWorkspace=${()=>setView("dash")}/>`;
  return html`<div class="app"><header><div class="logo" aria-label="DocIntel" title="DocIntel">D<span>i</span></div><nav>${[["home","Home","D"],["dash","Dashboard","⌂"],["rec","Records","▤"],["search","Search","⌕"]].map(([k,l,icon])=>html`<button class=${view===k?"on":""} aria-label=${l} title=${l} onClick=${()=>setView(k)}><span class="nav-icon" aria-hidden="true">${icon}</span><span class="nav-label">${l}</span></button>`)}</nav></header>
   <main>${view==="dash"?html`<${Dashboard} open=${setTarget} toast=${toast}/>`:view==="rec"?html`<${Records} open=${setTarget}/>`:html`<${Search} open=${setTarget}/>`}</main>
   ${target&&html`<${Drawer} target=${target} close=${()=>setTarget(null)} toast=${toast}/>`}<${Toast} msg=${msg}/></div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
